<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doble falta</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:     #FAFAF8;
      --text:   #111111;
      --muted:  #888882;
      --border: #DDDDD8;
      --font:   'Courier Prime', 'Courier New', Courier, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-logo {
      font-weight: 700;
      font-size: 15px;
    }

    /* ── Main area ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 48px 48px;
      max-width: 900px;
      width: 100%;
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .hero-label {
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hero-title {
      font-size: clamp(68px, 10vw, 108px);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.02em;
    }
    .hero-body {
      font-size: 19px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 480px;
    }
    .hero-body em {
      font-style: italic;
      color: var(--text);
    }

    /* ── Contact ── */
    .contact {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .contact-links {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }
    .contact-links a {
      font-size: 15px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: var(--border);
      transition: text-decoration-color 0.15s;
    }
    .contact-links a:hover {
      text-decoration-color: var(--text);
    }
    .contact-note {
      font-size: 14px;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 18px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .footer-logo {
      font-weight: 700;
      color: var(--text);
    }

    /* ── Reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .nav    { padding: 16px 24px; }
      main    { padding: 48px 24px 36px; }
      .footer { padding: 16px 24px; flex-direction: column; align-items: flex-start; gap: 4px; }
      .contact-links { gap: 20px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-logo">df</span>
  </nav>

  <main>
    <section class="hero">
      <p class="hero-label reveal">estudio de apps</p>
      <h1 class="hero-title reveal">doble<br/>falta</h1>
      <p class="hero-body reveal">
        Hago apps y proyectos creativos.<br/>
        <em>A veces me tiro sus chistecitos también.</em>
      </p>
    </section>

    <section class="contact">
      <div class="contact-links reveal">
        <a href="https://instagram.com/daniellr" target="_blank" rel="noopener">instagram → @daniellr</a>
        <a href="mailto:daniel@doblefalta.dev">correo → daniel@doblefalta.dev</a>
      </div>
      <p class="contact-note reveal">Respondo rápido si es para algo chistoso.</p>
    </section>
  </main>

  <footer class="footer">
    <span class="footer-logo">doble falta</span>
    <span>© 2026 — hecho con cafeína y dudas</span>
  </footer>

  <script>
    document.querySelectorAll('.reveal').forEach((el, i) => {
      setTimeout(() => el.classList.add('visible'), 80 + i * 90);
    });
  </script>

</body>
</html>

    strong { font-weight: 700; }
    a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .fecha { color: var(--muted); border-top: 1px solid var(--border); padding-top: 20px; margin-top: 32px; }
    .volver { display: inline-block; margin-bottom: 40px; color: var(--muted); text-decoration: none; }
